{% extends 'base.html' %}

{% block title %}Register - Blue Line Safety System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card card-custom p-4 shadow">
        <div class="text-center mb-4">
          <div class="fs-1 text-danger"><i class="bi bi-person-plus-fill"></i></div>
          <h3 class="fw-bold">Create Personal Safety Account</h3>
          <p class="text-muted small">Register to activate emergency protection and contact notifications</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="row g-3">
            <div class="col-md-12">
              <label for="full_name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. Rahul Sharma">
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="rahul@example.com">
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="phone" name="phone" value="{{ phone or '' }}" required placeholder="+91 9876543210">
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="password" name="password" required placeholder="At least 6 characters">
            </div>

            <div class="col-md-6">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
            </div>

            <div class="col-md-8">
              <label for="address" class="form-label fw-semibold">Home Address</label>
              <input type="text" class="form-control" id="address" name="address" value="{{ address or '' }}" placeholder="City, State, Zip Code">
            </div>

            <div class="col-md-4">
              <label for="blood_group" class="form-label fw-semibold">Blood Group (Optional)</label>
              <select class="form-select" id="blood_group" name="blood_group">
                <option value="">Select...</option>
                <option value="A+" {% if blood_group == 'A+' %}selected{% endif %}>A+</option>
                <option value="A-" {% if blood_group == 'A-' %}selected{% endif %}>A-</option>
                <option value="B+" {% if blood_group == 'B+' %}selected{% endif %}>B+</option>
                <option value="B-" {% if blood_group == 'B-' %}selected{% endif %}>B-</option>
                <option value="O+" {% if blood_group == 'O+' %}selected{% endif %}>O+</option>
                <option value="O-" {% if blood_group == 'O-' %}selected{% endif %}>O-</option>
                <option value="AB+" {% if blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                <option value="AB-" {% if blood_group == 'AB-' %}selected{% endif %}>AB-</option>
              </select>
            </div>

            <div class="col-md-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label small" for="terms">
                  I agree to the <a href="{{ url_for('dashboard.privacy') }}" target="_blank">Terms of Service & Privacy Policy</a>. I understand that GPS and sensor data are processed strictly for emergency safety dispatches in this prototype.
                </label>
              </div>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">
                <i class="bi bi-shield-lock me-1"></i> Register Account
              </button>
            </div>
          </div>
        </form>

        <div class="text-center mt-3">
          <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in here</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
