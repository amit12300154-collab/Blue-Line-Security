{% extends 'base.html' %}

{% block title %}403 - Forbidden Access - Blue Line{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="fs-1 text-warning mb-3"><i class="bi bi-shield-slash-fill"></i></div>
  <h1 class="display-4 fw-bold">403</h1>
  <h4 class="fw-bold mb-3">Access Denied / Forbidden</h4>
  <p class="text-muted mb-4">You do not have administrative privileges or authorization to access this secured resource.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary fw-bold">
    <i class="bi bi-house-door me-1"></i> Return Home
  </a>
</div>
{% endblock %}
