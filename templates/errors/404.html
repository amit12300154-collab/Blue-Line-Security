{% extends 'base.html' %}

{% block title %}404 - Page Not Found - Blue Line{% endblock %}

{% block content %}

  <h1 class="display-4 fw-bold">404</h1>
  <h4 class="fw-bold mb-3">Page Not Found</h4>

    <i class="bi bi-house-door me-1"></i> Return to Safety Portal
  </a>
</div>
{% endblock %}
