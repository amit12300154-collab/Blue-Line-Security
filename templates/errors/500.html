{% extends 'base.html' %}

{% block title %}500 - Internal Server Error - Blue Line{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="fs-1 text-danger mb-3"><i class="bi bi-exclamation-octagon-fill"></i></div>
  <h1 class="display-4 fw-bold">500</h1>
  <h4 class="fw-bold mb-3">Internal Server Error</h4>
  <p class="text-muted mb-4">An unexpected system error occurred. Details have been logged to the application audit log.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary fw-bold">
    <i class="bi bi-house-door me-1"></i> Return Home
  </a>
</div>
{% endblock %}
