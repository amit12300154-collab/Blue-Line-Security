{% extends 'base.html' %}

{% block title %}My Profile - Blue Line{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card card-custom p-4 shadow-sm">
        <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
          <div class="fs-1 text-primary"><i class="bi bi-person-badge"></i></div>
          <div>
            <h3 class="fw-bold mb-0">{{ user.full_name }}</h3>
            <p class="text-muted small mb-0">{{ user.email }} &bull; Role: <span class="badge bg-secondary">{{ user.role }}</span></p>
          </div>
        </div>

        <form method="POST" action="{{ url_for('auth.profile') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address (Read-Only)</label>
              <input type="email" class="form-control" value="{{ user.email }}" disabled>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Contact Phone</label>
              <input type="tel" class="form-control" name="phone" value="{{ user.phone }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Blood Group</label>
              <select class="form-select" name="blood_group">
                <option value="">Select Blood Group...</option>
                {% for bg in ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'] %}
                <option value="{{ bg }}" {% if user.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Home / Primary Address</label>
              <input type="text" class="form-control" name="address" value="{{ user.address or '' }}" placeholder="Enter residential address">
            </div>

            <hr class="my-4">

            <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-key-fill"></i> Change Account Password</h5>
            <div class="col-md-6">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" class="form-control" name="new_password" placeholder="Leave blank to keep unchanged">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary fw-bold px-4">
                <i class="bi bi-save me-1"></i> Update Profile
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
